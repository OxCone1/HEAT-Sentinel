    <!-- Inter, the desktop app's face. Loaded with media="print" so it never
         blocks first paint, then swapped to "all" once it has arrived — the
         same trick heat-tray/index.html uses, and for the same reason: an
         unreachable fonts.googleapis.com should cost a fallback, not a window
         that stays blank until the request times out. The --font-* stacks in
         styles/tokens.css degrade to Segoe UI / system-ui, so the builder is
         usable either way. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
